spring.application.name=Suscripciones
server.port=8080

# Habilitar la consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de la base de datos en memoria (limpia cada vez que reinicias)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=create-drop

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange.pagos=pagos-exchange

app.rabbitmq.exchange.suscripcion=suscripcion-exchange

app.rabbitmq.queue.exitoso=pago-exitoso-queue
app.rabbitmq.routing-key.exitoso=pago-exitoso

app.rabbitmq.queue.fallido=pago-fallido-queue
app.rabbitme.routing-key.fallido=pago-fallido

app.rabbitmq.queue.suscripcion-creada=suscripcion-creada-queue
app.rabbitmq.routing-key.suscripcion-creada=suscripcion-creada